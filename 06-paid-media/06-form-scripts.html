<style>
.t8-crm-form{display:block;margin:0 auto;border:none;width:100%;max-width:100%;background:transparent;opacity:0;transition:opacity .3s ease}
#t8-crm-host{display:none}
</style>
<div id="t8-crm-host"><iframe class="t8-crm-form" id="suluscrm-form-z17d2n9thb6ntje6xnnyzw7nhd8g2wqs" title="Book a Demo" src="https://crm.sulus.ai/f/z17d2n9thb6ntje6xnnyzw7nhd8g2wqs?lead_source_page=paid-media" height="200" frameborder="0" loading="eager" scrolling="no"></iframe></div>
<script>
(function(){
  function swap(){
    var host=document.getElementById('t8-crm-host');
    if(!host)return;
    var frame=host.querySelector('iframe');
    if(!frame)return;
    var old=document.querySelector('form.lead-form');
    if(!old||!old.parentNode)return;
    var target=old;
    var parent=old.parentNode;
    if(parent&&parent.nodeType===1&&parent.children&&parent.children.length===1&&parent.classList&&(parent.classList.contains('form-box')||parent.classList.contains('lead-card'))){
      target=parent;
    }
    target.parentNode.insertBefore(frame,target);
    target.parentNode.removeChild(target);
    if(host.parentNode)host.parentNode.removeChild(host);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',swap);}else{swap();}
  window.addEventListener('message',function(e){
    if(e.origin!=='https://crm.sulus.ai')return;
    var d=e.data;
    if(!d||typeof d!=='object')return;
    var fr=document.getElementsByTagName('iframe'),f=null,i=0;
    for(;i<fr.length;i++){if(fr.item(i).contentWindow===e.source)f=fr.item(i);}
    if(!f)return;
    if(d.type==='seedly-form-ready')f.style.opacity='1';
    if(d.type!=='seedly-form-resize')return;
    if(typeof d.height!=='number'||d.height<=0)return;
    f.style.height=Math.min(Math.max(d.height,200),4000)+'px';
  });
})();
</script>
<script id="t8-burger-js">
(function(){
  function boot(){
    var btn = document.querySelector('.burger');
    var links = document.querySelector('.nav-links');
    if(!btn || !links || btn.dataset.t8Bound === '1') return;
    btn.dataset.t8Bound = '1';
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      var open = links.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if(!links.classList.contains('is-open')) return;
      if(links.contains(e.target) || btn.contains(e.target)) return;
      links.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
    });
    links.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        links.classList.remove('is-open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
